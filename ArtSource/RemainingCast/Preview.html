<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Matcher — remaining cast idles</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui;background:#100e18;color:#f4eee4;--stage:#211d2b;--scale:3}*{box-sizing:border-box}body{margin:0}header{padding:24px 30px 16px;background:#191522;border-bottom:1px solid #42334c}h1{font-size:25px;margin:0 0 5px}p{color:#bbb1c7;margin:0}.controls{padding:13px 30px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#191522;position:sticky;top:0;z-index:2;border-bottom:1px solid #42334c}button,select{font:inherit;border:1px solid #67537d;background:#30263e;color:#f4eee4;border-radius:6px;padding:7px 11px}button:hover{background:#493559}label{display:flex;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;padding:24px;max-width:1600px;margin:auto}article{background:#191522;border:1px solid #342a43;border-radius:10px;overflow:hidden}article.ref{border-color:#b88a46}h2{font-size:16px;margin:13px 16px 0}.note{font-size:12px;margin:0 16px 9px;color:#c1b0cb}.stage{min-height:230px;background:var(--stage);display:flex;align-items:flex-end;justify-content:center;padding:15px 0 20px;position:relative}.stage:after{content:'';position:absolute;bottom:19px;left:20px;right:20px;border-bottom:1px solid #695d70}canvas{image-rendering:pixelated;display:block;width:calc(64px * var(--scale));height:calc(64px * var(--scale));position:relative;z-index:1}.native{height:89px;display:flex;align-items:center;justify-content:center;gap:20px;background:var(--stage);border-top:1px solid #342a43}.native canvas{width:64px;height:64px}.native span{font-size:12px;color:#a99cb5}footer{padding:15px 30px 30px;color:#aa9bb8}a{color:#e7c979}#counter{font-variant-numeric:tabular-nums;min-width:83px}.light{--stage:#d7d1c5}.light .native span{color:#4e3d6c}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(150px,1fr));padding:12px;gap:10px}:root{--scale:2}.stage{min-height:167px}.controls{padding:10px}.native{gap:8px}header{padding:20px}h2{font-size:14px}}
</style></head><body>
<header><h1>Dungeon Matcher · idle family</h1><p>Corrected helmets, connected poses and rigid props. Compare both passes against the unchanged Rattlebones reference.</p></header>
<div class="controls"><button id="play">Pause</button><button id="prev" aria-label="Previous frame">←</button><button id="next" aria-label="Next frame">→</button><label>Frame <select id="frame" aria-label="Frame"></select></label><span id="counter">130 ms</span><label>Group <select id="group"><option value="all">All characters</option><option value="guard">Guards &amp; Marshal</option><option value="knight">Knights</option><option value="royal">Royal cast</option><option value="monster">Minotaur</option></select></label><label>Zoom <select id="zoom"><option value="1">1× native</option><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option></select></label><button id="background">Light background</button></div>
<main class="grid" id="grid"></main><footer>Each frame holds 130 ms. Sources: <a href="Idles/">LibreSprite files, sprite sheets and GIFs</a> · <a href="Recolored/">Recolored stills</a> · <a href="Review/Correction/">All-frame and before/after review boards</a></footer>
<script>
const cast=[['Rattlebones','ref','Review/Rattlebones_Reference.png'],['Crossbow Guard','guard','CrossbowGuard'],['Barricade Guard','guard','BarricadeGuard'],['Spear Guard','guard','SpearGuard'],['Town Marshal','guard','TownMarshal'],['Siege Sergeant','guard','SiegeSergeant'],['Sword Knight','knight','SwordKnight'],['Spear Knight','knight','SpearKnight'],['Shield Knight','knight','ShieldKnight'],['Knight Captain','knight','KnightCaptain'],['Royal Swordsman','royal','RoyalSwordsman'],['Royal Lancer','royal','RoyalLancer'],['Royal Arbalist','royal','RoyalArbalist'],['Royal Standard Bearer','royal','RoyalStandardBearer'],['Royal Arcanist','royal','RoyalArcanist'],['Royal Mage','royal','RoyalMage'],['King','royal','King'],['Minotaur','monster','Minotaur']];
const grid=document.getElementById('grid'),frame=document.getElementById('frame'),play=document.getElementById('play'),group=document.getElementById('group'),zoom=document.getElementById('zoom');
const versionLabel=document.createElement('label');versionLabel.textContent='Pass ';
const version=document.createElement('select');version.setAttribute('aria-label','Pass');version.add(new Option('Corrected','Idles'));version.add(new Option('Before correction','BeforeCorrection/Idles'));versionLabel.append(version);document.querySelector('.controls').append(versionLabel);
for(let i=0;i<9;i++)frame.add(new Option(String(i+1),String(i)));
let running=true,current=0,start=performance.now(),loaded=0;const views=[];
for(const [name,faction,path]of cast){const article=document.createElement('article');article.className=faction==='ref'?'ref':'';article.dataset.group=faction;article.innerHTML=`<h2>${name}</h2><p class="note">${faction==='ref'?'Reference · unchanged':'9 frames · 130 ms each'}</p><div class="stage"><canvas width="64" height="64" aria-label="${name} enlarged"></canvas></div><div class="native"><span>Native size</span><canvas width="64" height="64" aria-label="${name} native"></canvas></div>`;grid.append(article);const im=new Image();im.onload=()=>{loaded++;article.dataset.loaded='true';paint()};im.onerror=()=>{article.querySelector('.note').textContent='Image failed to load';article.dataset.loaded='false'};im.src=faction==='ref'?path:`Idles/${path}_Idle.png`;views.push({im,canvases:article.querySelectorAll('canvas')});}
function paint(){for(const v of views)if(v.im.complete&&v.im.naturalWidth){for(const c of v.canvases){const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,64,64);ctx.drawImage(v.im,current*64,0,64,64,0,0,64,64);c.dataset.frame=String(current+1);}}frame.value=String(current);document.getElementById('counter').textContent=`${current*130}–${(current+1)*130} ms`;}
function stop(){running=false;play.textContent='Play'}
version.onchange=()=>{for(let i=1;i<views.length;i++)views[i].im.src=`${version.value}/${cast[i][2]}_Idle.png`;};
play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play';start=performance.now()-current*130;};
frame.onchange=()=>{stop();current=Number(frame.value);paint()};
document.getElementById('prev').onclick=()=>{stop();current=(current+8)%9;paint()};document.getElementById('next').onclick=()=>{stop();current=(current+1)%9;paint()};
group.onchange=()=>{for(const a of grid.children)a.hidden=group.value!=='all'&&a.dataset.group!==group.value&&a.dataset.group!=='ref';};
zoom.onchange=()=>document.documentElement.style.setProperty('--scale',zoom.value);
document.getElementById('background').onclick=()=>{document.body.classList.toggle('light');document.getElementById('background').textContent=document.body.classList.contains('light')?'Dark background':'Light background';};
function tick(t){if(running){const f=Math.floor((t-start)/130)%9;if(f!==current){current=f;paint();}}requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
