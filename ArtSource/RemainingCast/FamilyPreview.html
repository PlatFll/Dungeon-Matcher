<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dungeon Matcher — grounded idle family</title><style>
:root{color-scheme:dark;font:15px/1.5 system-ui;background:#100e18;color:#f4eee4;--stage:#211d2b;--zoom:2}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px 12px;background:#191522}h1{font-size:24px;margin:0 0 4px}p{margin:0;color:#c1b0cb}.controls{position:sticky;top:0;z-index:1;padding:12px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#191522;border-bottom:1px solid #67537d}button,select{font:inherit;padding:6px 10px;border:1px solid #67537d;border-radius:6px;background:#30263e;color:#f4eee4}label{display:flex;gap:8px;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--card,230px),1fr));gap:14px;padding:20px;max-width:1700px;margin:auto}article{border:1px solid #42334c;border-radius:8px;overflow:hidden;background:#191522}article:first-child{border-color:#b88a46}h2{font-size:16px;margin:10px 14px 4px}.stage{background:var(--stage);height:264px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:15px}.stage canvas{width:calc(var(--w) * var(--zoom) * 1px);height:calc(var(--h) * var(--zoom) * 1px);border-bottom:1px solid #695d70}.native{background:var(--stage);border-top:1px solid #42334c;display:flex;align-items:flex-end;justify-content:center;gap:14px;height:108px;padding-bottom:12px}.native span{font-size:12px;color:#a99cb5}canvas{image-rendering:pixelated}footer{padding:10px 28px 28px;color:#c1b0cb}a{color:#e7c979}.light{--stage:#d7d1c5}.light .native span{color:#4e3d6c}
</style></head><body><header><h1>Grounded idle family</h1><p>Miner through King · restored guard rhythm · unchanged Rattlebones reference</p></header>
<div class="controls"><button id="play">Pause</button><label>Group <select id="group"><option>Locals</option><option>Guards</option><option>Knights</option><option>Royals</option><option>All</option></select></label><label>Frame <select id="frame"></select></label><label>Zoom <select id="zoom"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label><button id="background">Light background</button><span>9 × 130 ms · 1.17-second loop</span></div>
<main class="grid" id="grid"></main><footer>Fixed source scale and ground. Each card also shows native size. <a href="SelectedIdles/README.md">Sources and review notes</a></footer>
<script>
const groups={Locals:['Miner','BasketVillager','BarricadeVillager','TownMarshal'],Guards:['CrossbowGuard','BarricadeGuard','SpearGuard','SiegeSergeant'],Knights:['SwordKnight','SpearKnight','ShieldKnight','KnightCaptain'],Royals:['RoyalSwordsman','RoyalLancer','RoyalArbalist','RoyalStandardBearer','RoyalArcanist','RoyalMage','King']};
const frame=document.getElementById('frame'),play=document.getElementById('play');let views=[],running=true,current=0,start=performance.now();
for(let f=0;f<9;f++)frame.add(new Option(String(f+1),String(f)));
function build(){const group=document.getElementById('group').value,names=group==='All'?Object.values(groups).flat():groups[group];views=[];document.getElementById('grid').replaceChildren();
 for(const n of ['Rattlebones',...names]){const w=n==='Miner'?96:64,h=n==='Miner'?80:64,a=document.createElement('article');a.style.setProperty('--w',w);a.style.setProperty('--h',h);const title=n==='Rattlebones'?'Rattlebones reference':n.replace(/([a-z])([A-Z])/g,'$1 $2');a.innerHTML=`<h2>${title}</h2><div class="stage"><canvas width="${w}" height="${h}" aria-label="${title} enlarged"></canvas></div><div class="native"><span>Native size</span><canvas width="${w}" height="${h}" aria-label="${title} native"></canvas></div>`;document.getElementById('grid').append(a);const im=new Image();views.push({im,w,h,canvases:a.querySelectorAll('canvas')});im.onload=paint;im.onerror=()=>a.append('Image failed to load');im.src=n==='Rattlebones'?'Review/Rattlebones_Reference.png':groups.Guards.includes(n)?`../GuardIdles/${n}_Idle.png`:['Miner','BasketVillager','BarricadeVillager'].includes(n)?`../LocalEnemies/${n}_Idle.png`:`SelectedIdles/${n}_Idle.png`;}
}
function paint(){for(const v of views)if(v.im.complete&&v.im.naturalWidth)for(const c of v.canvases){const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,v.w,v.h);ctx.drawImage(v.im,current*v.w,0,v.w,v.h,0,0,v.w,v.h);}frame.value=String(current);}
play.onclick=()=>{running=!running;play.textContent=running?'Pause':'Play';start=performance.now()-current*130;};frame.onchange=()=>{running=false;play.textContent='Play';current=Number(frame.value);paint();};document.getElementById('group').onchange=build;document.getElementById('zoom').onchange=e=>{document.documentElement.style.setProperty('--zoom',e.target.value);document.documentElement.style.setProperty('--card',Math.max(230,96*Number(e.target.value)+22)+'px');};document.getElementById('background').onclick=e=>{document.body.classList.toggle('light');e.target.textContent=document.body.classList.contains('light')?'Dark background':'Light background';};function tick(t){if(running){const f=Math.floor((t-start)/130)%9;if(f!==current){current=f;paint();}}requestAnimationFrame(tick);}build();requestAnimationFrame(tick);
</script></body></html>
