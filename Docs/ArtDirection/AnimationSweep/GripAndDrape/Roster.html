<script>
'use strict';
const rows=JSON.parse(document.getElementById('data').textContent), el=id=>document.getElementById(id);
let clip,images=[],frame=0,elapsed=0,last=null,playing=false,version=0;
for(const [id,r] of Object.entries(rows))el('enemy').add(new Option(r.name,id));
function actor(id){el('enemy').value=id;const r=rows[id];el('focus').textContent=r.focus;el('state').replaceChildren(...r.clips.map(c=>new Option(c.state,c.state)));el('state').value=(r.clips.find(c=>c.state==='Idle')||r.clips[0]).state;select();}
function select(){clip=rows[el('enemy').value].clips.find(c=>c.state===el('state').value);const token=++version;el('error').hidden=true;images=clip.tex.map(path=>{const im=new Image();im.onload=()=>{if(token===version)draw()};im.onerror=()=>{if(token===version)el('error').hidden=false};im.src='../../../../'+path;return im});el('range').max=clip.frames.length;el('changes').textContent=clip.changed.length?'Edited exposures '+clip.changed.join(', ')+'.':'';seek(0)}
function seek(i){frame=(i+clip.frames.length)%clip.frames.length;playing=false;elapsed=0;last=null;draw()}
function draw(){const [idx,x,y]=clip.frames[frame],im=images[idx],[l,t,r,b]=clip.box,w=r-l+4,h=b-t+4,c=el('pose'),well=el('well');const scale=Math.max(1,Math.floor(Math.min((well.clientWidth-4)/w,(well.clientHeight-4)/h)));c.width=w;c.height=h;c.style.width=w*scale+'px';c.style.height=h*scale+'px';if(im&&im.complete&&im.naturalWidth){const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.drawImage(im,x+l,y+t,r-l,b-t,2,2,r-l,b-t)}el('range').value=frame+1;el('count').textContent=(frame+1)+' / '+clip.frames.length+' · '+clip.frames[frame][5]+' ms';el('play').textContent=playing?'Pause':'Play'}
function tick(now){if(playing){if(last!==null)elapsed+=Math.min(500,now-last);last=now;let change=false;while(elapsed>=clip.frames[frame][5]){elapsed-=clip.frames[frame][5];frame=(frame+1)%clip.frames.length;change=true}if(change)draw()}requestAnimationFrame(tick)}
el('enemy').onchange=()=>actor(el('enemy').value);el('state').onchange=select;el('prev').onclick=()=>seek(frame-1);el('next').onclick=()=>seek(frame+1);el('range').oninput=()=>seek(+el('range').value-1);el('play').onclick=()=>{playing=!playing;last=null;draw()};el('matte').onchange=()=>el('well').classList.toggle('light',el('matte').checked);window.addEventListener('resize',draw);document.addEventListener('visibilitychange',()=>{last=null});actor('guild_chirurgeon');requestAnimationFrame(tick);
