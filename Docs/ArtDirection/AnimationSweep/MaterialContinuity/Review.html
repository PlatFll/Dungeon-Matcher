<main><h1>Motion and shading</h1><p>Compare the same exposure before and after the repair. Both drawings use the original clip timing.</p>

<script>
'use strict';
const rows=JSON.parse(document.getElementById('data').textContent);
const ui=Object.fromEntries([...document.querySelectorAll('[id]')].map(el=>[el.id,el]));
const labels={AutoAttack:'Basic attack',Ability:'Ability',Still:'Fallback still'};
const actionName=r=>labels[r.state]||r.state;
const names=new Map(rows.map(r=>[r.actor,r.name]));
for(const [id,name] of [...names].sort((a,b)=>a[1].localeCompare(b[1])))ui.actor.add(new Option(name,id));
let row,image,frame=0,elapsed=0,playing=false,previous=null,version=0;
function selectActor(id,state='Idle'){
 ui.actor.value=id;ui.action.replaceChildren();
 const choices=rows.filter(r=>r.actor===id);
 for(const r of choices)ui.action.add(new Option(actionName(r),r.state));
 ui.action.value=choices.some(r=>r.state===state)?state:choices[0].state;load();
}
function load(){
 const token=++version;row=rows.find(r=>r.actor===ui.actor.value&&r.state===ui.action.value);image=null;
 ui.title.textContent=row.name+' · '+actionName(row);ui.note.textContent=row.note;
 ui.native.href='../../../../'+row.editable;ui.detailControl.hidden=!row.detail;ui.detail.checked=!!row.detail;
 ui.scrub.max=row.durations.length;ui.error.hidden=true;ui.play.disabled=row.durations.length===1;
 ui.next.disabled=ui.prev.disabled=ui.scrub.disabled=ui.play.disabled;
 setFrame(row.detail?1:0);const img=new Image();
 img.onload=()=>{if(token!==version)return;if(img.width!==row.width*row.durations.length||img.height!==2*row.height){ui.error.hidden=false;return}image=img;draw()};
 img.onerror=()=>{if(token===version)ui.error.hidden=false};img.src=row.strip;
}
function setFrame(i){
 frame=(i+row.durations.length)%row.durations.length;elapsed=0;previous=null;playing=false;draw();
}
function draw(){
 ui.play.textContent=playing?'Pause':'Play';ui.scrub.value=frame+1;ui.counter.textContent=(frame+1)+' / '+row.durations.length+' · '+row.durations[frame]+' ms';
 const box=row.detail&&ui.detail.checked?row.detail:[0,0,row.width,row.height];
 const [left,top,right,bottom]=box,w=right-left,h=bottom-top;
 let size=1;
 for(const [y,canvas] of [ui.before,ui.after].entries()){
  const bounds=canvas.parentElement.getBoundingClientRect();size=Math.max(1,Math.floor(Math.min((bounds.width-4)/w,(bounds.height-4)/h)));
  canvas.width=w;canvas.height=h;canvas.style.width=(w*size)+'px';canvas.style.height=(h*size)+'px';
  const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
  if(image)ctx.drawImage(image,frame*row.width+left,y*row.height+top,w,h,0,0,w,h);
 }
 ui.scale.textContent=size+'× native pixels';
}
function tick(t){
 if(playing&&image){
  if(previous!==null)elapsed+=t-previous;
  previous=t;
  if(elapsed>=row.durations[frame]){
   elapsed%=row.durations.reduce((a,b)=>a+b,0);
   while(elapsed>=row.durations[frame]){elapsed-=row.durations[frame];frame=(frame+1)%row.durations.length}
   draw();
  }
 }
 requestAnimationFrame(tick);
}
ui.actor.onchange=()=>selectActor(ui.actor.value);ui.action.onchange=load;ui.prev.onclick=()=>setFrame(frame-1);ui.next.onclick=()=>setFrame(frame+1);
ui.play.onclick=()=>{playing=!playing;previous=null;draw()};ui.scrub.oninput=()=>setFrame(Number(ui.scrub.value)-1);
ui.detail.onchange=draw;ui.matte.onchange=()=>document.body.classList.toggle('alt',ui.matte.checked);
document.addEventListener('visibilitychange',()=>{previous=null});window.addEventListener('resize',draw);
selectActor('knight');requestAnimationFrame(tick);
</script></html>
