<script>
'use strict';
const data=JSON.parse(document.getElementById('records').textContent);
const ids={};for(const el of document.querySelectorAll('[id]'))ids[el.id]=el;
const labels={AutoAttack:'Basic attack',Ability:'Ability',Idle:'Idle',Death:'Death',Hit:'Hit',ChannelHold:'Channel hold',ChannelStart:'Channel start'};
const stateName=s=>labels[s]||s.replace(/([a-z])([A-Z])/g,'$1 $2');
const chosenActors=[...new Map(data.map(r=>[r.actor,r.name])).entries()].sort((a,b)=>a[0]==='miner'?-1:b[0]==='miner'?1:a[1].localeCompare(b[1]));

 index=i;const item=data[index];ids.actor.value=item.actor;ids.state.replaceChildren();
 for(const n of order.filter(n=>data[n].actor===item.actor))ids.state.add(new Option(stateName(data[n].state),String(n)));
 ids.state.value=String(i);ids.clipTitle.textContent=item.name+' · '+stateName(item.state);ids.note.textContent=item.note;
 const hasScene=Boolean(item.scene);source=hasScene&&(requested||'scene')==='scene'?'scene':'native';
 ids.source.hidden=!hasScene;ids.nativeLabel.hidden=hasScene;ids.scene.setAttribute('aria-pressed',String(source==='scene'));ids.nativeMode.setAttribute('aria-pressed',String(source==='native'));

  for(const j of changed){const b=document.createElement('button');b.textContent=String(j);b.title='Inspect frame '+j;b.onclick=()=>jump(j-1);ids.changed.append(b)}}

 ids.scrub.max=String(media.durations.length);absolute=savedTime%length;frame=0;while(frame+1<breaks.length&&absolute>=breaks[frame+1])frame++;last=null;sheet=null;ids.error.hidden=true;

  sheet=image;draw();last=null};

 ids.sourceNote.textContent=source==='scene'?'Game scene · 1080 × 1920 capture · original clip timing':'Native sprite · '+media.frameWidth+' × '+media.frameHeight+' px · original clip timing';
 image.src=media.strip;draw();buttons();matte();
}
function error(message){ids.error.textContent=message;ids.error.hidden=false;moving=false;buttons()}
function matte(){document.documentElement.style.setProperty('--matte',ids.matte.checked&&source==='native'?'#b7bdbe':'#343d44')}
function draw(){
 const zoom=!ids.waist.hidden&&ids.detail.checked;const w=media.frameWidth,h=media.frameHeight;
 const crop=zoom?[54,112,86,44]:[0,0,w,h];
 for(const [row,target] of [[0,ids.old],[1,ids.fresh]]){
  const [x,y,cw,ch]=crop;target.width=cw;target.height=ch;
  const rect=target.parentElement.getBoundingClientRect(),roomX=Math.max(10,rect.width-(innerWidth<=600?6:16)),roomY=Math.max(10,rect.height-(innerWidth<=600?6:16));
  const fit=Math.min(roomX/cw,roomY/ch);const scale=fit>=1?Math.floor(fit):fit;
  target.style.width=(cw*scale)+'px';target.style.height=(ch*scale)+'px';
  const ctx=target.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,cw,ch);if(sheet)ctx.drawImage(sheet,frame*w+x,row*h+y,cw,ch,0,0,cw,ch);

}

function tick(now){if(moving&&sheet&&!document.hidden&&last!==null){

 last=document.hidden?null:now;requestAnimationFrame(tick)}
