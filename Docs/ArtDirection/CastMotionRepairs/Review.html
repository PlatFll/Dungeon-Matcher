<style>

* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); }
h1,h2,h3,p { margin: 0; }

main { padding-block: clamp(20px,3vw,40px) 40px; }

.workspace { display: grid; grid-template-columns: minmax(224px, .9fr) minmax(0,3.6fr); align-items: start; gap: clamp(14px,2.2vw,28px); }

.scope button { flex: 1 1 auto; white-space: nowrap; padding: .3rem .43rem; font-size: .78rem; }
button[aria-pressed="true"] { color: #231a0c; background: var(--accent); border-color: var(--accent); }
.scope-summary { color: var(--subtle); font-size: .78rem; font-variant-numeric: tabular-nums; }
.results { border-top: 1px solid var(--line); max-height: min(58vh,650px); overflow-y: auto; }
.results button { display: flex; width: 100%; align-items: start; justify-content: space-between; text-align: left; gap: 8px; border: 0; border-radius: 0; border-bottom: 1px solid #2c3744; border-left: 3px solid transparent; padding: 9px 11px; background: transparent; }

.mobile-choice { display: none; }
.viewer { padding: clamp(13px,1.9vw,24px); }
.case-head { margin-bottom: 14px; }
.family { color: var(--muted); font-size: .79rem; margin-bottom: 3px; }
h2 { letter-spacing: -.038em; font-size: clamp(1.4rem,2.6vw,2.4rem); line-height: 1.12; }
.state { color: var(--muted); font-weight: 460; }
.stages { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 7px; }

figcaption { display:flex; align-items:center; min-height:29px; margin-bottom:4px; color:var(--muted); font-size:.78rem; font-weight:600; }
.comparison-source { max-width:100%; font:inherit; color:var(--text); padding:.19rem .35rem; }
.stage { height: clamp(166px,22.5vw,292px); min-width: 0; background: #333d4b; border: 1px solid #4c5969; border-radius: 3px; overflow: hidden; }
.light .stage { background: #d4cec1; border-color: #ded8cb; }
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }

.notes dt { color: var(--muted); font-weight: 600; }
.notes dd { margin: 0; }
.sources { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 13px; font-size: .8rem; }
.scene-box { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 9px; }
summary { color: var(--accent); font-size: .86rem; cursor: pointer; }
.scene-box img { margin-top: 10px; max-width: 100%; max-height: 70vh; image-rendering: pixelated; }
.empty,.problem { color: var(--muted); padding: 18px; border: 1px solid var(--line); border-radius: 4px; }
.problem { margin-top: 8px; font-size: .84rem; }
.empty button { margin-top: 10px; }
@media (max-width: 800px) {

  .scope { align-items: center; }
  .scope-summary { align-self: center; text-align: right; }
  .mobile-choice { display: grid; grid-column: 1 / -1; }

@media (max-width: 480px) {

  .matte span { display: none; }

}
</style>

<h1>Animation repair review</h1>
<div class="workspace">

    <div class="scope" id="scope" role="group" aria-label="Repair group"></div>
    <div class="scope-summary" id="count" role="status"></div>
    <label class="field">Search repairs<input id="search" type="search" placeholder="Character, action or issue"></label>
    <label class="field">Character<select id="actor"></select></label>
    <label class="field mobile-choice">Animation<select id="mobileClip"></select></label>
  </div>
  <div class="results" id="list" aria-label="Matching animations"></div>
</aside>
<section id="viewer" class="viewer" aria-labelledby="caseTitle">
  <div class="case-head">
    <p id="family" class="family"></p>
    <h2 id="caseTitle"><span id="name"></span> <span class="state" id="state"></span></h2>
  </div>
  <div class="stages" id="stages">
    <figure><figcaption><span id="leftFixed">Previous game</span><select id="leftVersion" class="comparison-source" aria-label="Left comparison source" hidden><option value="reviewed">Last review</option><option value="before">Previous game</option></select></figcaption><div class="stage"><canvas id="before" aria-label="Previous game animation"></canvas></div></figure>
    <figure><figcaption>Updated animation</figcaption><div class="stage"><canvas id="after" aria-label="Updated animation"></canvas></div></figure>
  </div>
  <div id="problem" class="problem" role="alert" hidden></div>
  <div class="transport" role="group" aria-label="Playback controls">
    <button id="play" type="button" class="play">Play</button>
    <button id="replay" type="button">Replay</button>
    <button id="prev" type="button" class="step" title="Previous frame" aria-label="Previous frame">◀</button>
    <button id="next" type="button" class="step" title="Next frame" aria-label="Next frame">▶</button>
    <select id="speed" aria-label="Playback speed"><option value="1">1×</option><option value=".5">½×</option><option value=".25">¼×</option></select>
    <div class="matte" role="group" aria-label="Preview matte"><span>Matte</span><button id="dark" type="button" aria-pressed="true">Dark</button><button id="light" type="button" aria-pressed="false">Light</button></div>
  </div>
  <div class="timeline"><input id="time" aria-label="Animation time" type="range" min="0" value="0" step="1"><output id="readout" for="time"></output></div>
  <div class="cited" id="cited"></div>
  <div class="notes">
    <h3 id="title"></h3>
    <dl><dt>Issue</dt><dd id="issue"></dd><dt>Repair</dt><dd id="fix"></dd></dl>
    <div class="sources"><a id="native">Editable sprite</a><a id="clip">Unity clip</a></div>
  </div>
  <details id="scene" class="scene-box" hidden><summary>Unity Game scene capture</summary><img id="capture" alt=""></details>
</section>
<section class="empty" id="empty" hidden><p>No animations match these filters.</p><button id="clear" type="button">Clear filters</button></section>
</div>

<script>

const data = JSON.parse(document.getElementById("records").textContent);

const pretty = value => String(value || "").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/[_-]+/g," ");
const stateName = record => pretty(record.state);
const groupName = key => key === "Audit" ? "Audit clips" : key === "Expansion" ? "Expansion" : "All";
const make = (tag,text) => { const node = document.createElement(tag); node.textContent = text; return node; };
const byName = (a,b) => a.name.localeCompare(b.name) || stateName(a).localeCompare(stateName(b)) || a.title.localeCompare(b.title);
const ordered = data.slice().sort(byName);
const defaultCase = data.find(r => r.actor === "iceborn_axeman" && r.state.toLowerCase().replace(/[^a-z]/g,"") === "autoattack") || data[0];
let group = "All";
let selected = null;
let pictures = [];
let alternatives = {};
let starts = [];
let duration = 0;
let cursor = 0;
let clock = 0;
let play = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let request = 0;
let generation = 0;
let priorFrame = -1;
const buttons = new Map();

function populateGroups() {
  for (const key of ["All","Expansion","Audit"]) {
    const total = key === "All" ? data.length : data.filter(record => record.group === key).length;
    const button = make("button", groupName(key) + " " + total);
    button.type = "button";
    button.addEventListener("click", () => { group = key; populateActors(); filter(); });
    $("scope").append(button);
    buttons.set(key,button);
  }
}
function groupRecords() {
  return ordered.filter(record => group === "All" || record.group === group);
}
function populateActors() {
  const select = $("actor");
  const old = select.value;
  select.replaceChildren(new Option("All characters",""));
  const seen = new Set();
  for (const record of groupRecords()) {
    if (seen.has(record.actor)) continue;
    select.append(new Option(record.name,record.actor));
    seen.add(record.actor);
  }
  select.value = seen.has(old) ? old : "";
}
function choose(record) {
  if (!record) return;
  document.querySelectorAll("#list button").forEach(button => {
    button.setAttribute("aria-current", String(data[Number(button.value)] === record));
  });
  $("mobileClip").value = String(data.indexOf(record));
  if (selected === record) return;
  selected = record;
  pictures = [];
  alternatives = {};
  $("leftFixed").hidden = !!record.reviewed;
  $("leftVersion").hidden = !record.reviewed;
  $("leftVersion").value = record.reviewed ? "reviewed" : "before";
  $("before").setAttribute("aria-label",record.reviewed ? "Last review animation" : "Previous game animation");
  priorFrame = -1;
  starts = [];
  duration = 0;
  for (const ms of record.times) { starts.push(duration); duration += ms; }
  cursor = 0;
  clock = performance.now();
  $("time").max = String(Math.max(0,duration - 1));
  $("name").textContent = record.name;
  $("state").textContent = "· " + stateName(record);
  $("family").textContent = [record.group === "Audit" ? "Cast audit" : "Expansion", pretty(record.family)].filter(Boolean).join(" / ");
  for (const id of ["title","issue","fix"]) $(id).textContent = record[id];
  for (const id of ["native","clip"]) {
    $(id).hidden = !record[id];
    if (record[id]) $(id).setAttribute("href",record[id]);
    else $(id).removeAttribute("href");
  }
  $("scene").open = false;
  $("scene").hidden = !record.scene;
  $("capture").removeAttribute("src");
  $("capture").alt = record.name + " " + stateName(record) + " in the Unity Game scene";
  $("cited").replaceChildren();
  const cited = [...new Set(record.cited || [])].filter(n => Number.isInteger(n) && n > 0 && n <= starts.length);
  if (cited.length) $("cited").append(make("span","Cited frames"));
  for (const n of cited) {
    const button = make("button",String(n));
    button.type = "button";
    button.setAttribute("aria-label","Go to cited frame " + n);
    button.addEventListener("click",() => seek(starts[n - 1]));
    $("cited").append(button);
  }
  $("problem").hidden = true;
  render(true);
  endLoop();
  const sequence = ++generation;
  const variants = record.reviewed ? ["before","after","reviewed"] : ["before","after"];
  Promise.all(variants.map(key => loadImage(record[key]))).then(images => {
    if (sequence !== generation) return;
    if (images.some(image => image.naturalWidth !== record.size[0] * starts.length || image.naturalHeight !== record.size[1])) {
      throw Error("The frame strip dimensions do not match this clip.");
    }
    alternatives = Object.fromEntries(variants.map((key,index) => [key,images[index]]));
    pictures = [alternatives[$("leftVersion").value],alternatives.after];
    clock = performance.now(); render(true); beginLoop();
  }).catch(error => {
    if (sequence !== generation) return;
    $("problem").textContent = error.message;
    $("problem").hidden = false;
  });
}
function filter(preferred) {
  const words = $("search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const actor = $("actor").value;
  const visible = groupRecords().filter(record => {
    const text = [record.name,record.actor,record.state,stateName(record),record.title,record.family,record.issue,record.fix,record.group].join(" ").toLowerCase();
    return (!actor || record.actor === actor) && words.every(word => text.includes(word));
  });
  for (const [key,button] of buttons) button.setAttribute("aria-pressed",String(key === group));
  $("list").replaceChildren();
  $("mobileClip").replaceChildren();
  for (const record of visible) {
    const id = String(data.indexOf(record));
    const button = make("button","");
    button.type = "button"; button.value = id;
    const name = make("span",record.name); name.className = "actor";
    const state = make("span",stateName(record)); state.className = "action";
    button.append(name,state); button.title = record.title;
    button.addEventListener("click",() => choose(record));
    $("list").append(button);
    $("mobileClip").append(new Option(record.name + " · " + stateName(record),id));
  }
  $("count").textContent = visible.length + " of " + data.length + " animations";
  $("empty").hidden = !!visible.length;
  $("viewer").hidden = !visible.length;
  if (visible.length) {
    const next = visible.includes(preferred) ? preferred : visible.includes(selected) ? selected : visible[0];
    choose(next);
    render(true);
    beginLoop();
  } else {
    generation++; selected = null; pictures = []; endLoop();
  }
}
function loadImage(url) {
  return new Promise((resolve,reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(Error("Could not open " + url + ". Keep the media folder beside this page."));
    image.src = url;
  });
}
function currentFrame() {
  let frame = 0;
  while (frame + 1 < starts.length && starts[frame + 1] <= cursor) frame++;
  return frame;
}
function render(force = false) {
  if (!selected || !starts.length) return;
  const index = currentFrame();
  const ms = Math.floor(cursor);
  $("play").textContent = play ? "Pause" : "Play";
  $("time").value = String(ms);
  $("readout").textContent = "F" + (index + 1) + " / " + starts.length + " · " + ms + " / " + duration + " ms";
  if (index === priorFrame && !force) return;
  priorFrame = index;
  for (let i = 0; i < stages.length; i++) {
    const canvas = stages[i];
    const dpr = Math.min(window.devicePixelRatio || 1, 4);
    const width = Math.max(1,Math.round(canvas.clientWidth * dpr));
    const height = Math.max(1,Math.round(canvas.clientHeight * dpr));
    if (width !== canvas.width) canvas.width = width;
    if (height !== canvas.height) canvas.height = height;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,width,height);
    if (!pictures[i]) continue;
    ctx.imageSmoothingEnabled = false;
    const [w,h] = selected.size;
    const available = Math.min(width * .92 / w,height * .87 / h);
    const scale = available >= 1 ? Math.floor(available) : available;
    const dw = Math.round(w*scale), dh = Math.round(h*scale);
    ctx.drawImage(pictures[i],index*w,0,w,h,Math.round((width-dw)/2),Math.round((height-dh)/2),dw,dh);
  }
}
function endLoop() { if (request) cancelAnimationFrame(request); request = 0; }
function beginLoop() {
  if (request || !play || !pictures.length || !selected || document.hidden) return;
  clock = performance.now();
  request = requestAnimationFrame(tick);
}
function tick(now) {
  request = 0;
  if (!selected || !play || document.hidden) return;
  cursor = (cursor + Math.max(0,now-clock) * Number($("speed").value)) % duration;
  clock = now;
  render();
  request = requestAnimationFrame(tick);
}
function seek(ms) { endLoop(); play = false; cursor = Math.max(0,Math.min(ms,duration-1)); render(true); }
function step(delta) { if (selected) seek(starts[(currentFrame()+delta+starts.length) % starts.length]); }
function togglePlay() {
  play = !play;
  if (play) beginLoop(); else endLoop();
  render();
}
$("actor").addEventListener("change",() => filter());
$("search").addEventListener("input",() => filter());
$("mobileClip").addEventListener("change",event => choose(data[Number(event.target.value)]));
$("clear").addEventListener("click",() => { group="All"; $("search").value=""; populateActors(); $("actor").value=""; filter(defaultCase); });
$("play").addEventListener("click",togglePlay);
$("prev").addEventListener("click",() => step(-1));
$("next").addEventListener("click",() => step(1));
$("replay").addEventListener("click",() => { cursor=0; play=true; clock=performance.now(); render(true); beginLoop(); });
$("time").addEventListener("input",event => seek(Number(event.target.value)));
$("leftVersion").addEventListener("change",event => {
  const key = event.target.value;
  $("before").setAttribute("aria-label",key === "reviewed" ? "Last review animation" : "Previous game animation");
  if (alternatives[key]) { pictures[0] = alternatives[key]; render(true); }
});
$("speed").addEventListener("change",() => { clock=performance.now(); });
for (const id of ["light","dark"]) $(id).addEventListener("click",() => {
  $("stages").classList.toggle("light",id === "light");
  $("light").setAttribute("aria-pressed",String(id === "light"));
  $("dark").setAttribute("aria-pressed",String(id === "dark"));
});
$("scene").addEventListener("toggle",() => {
  if ($("scene").open && selected && selected.scene) $("capture").src = selected.scene;
  else $("capture").removeAttribute("src");
});
document.addEventListener("visibilitychange",() => { if (document.hidden) endLoop(); else beginLoop(); });
window.addEventListener("resize",() => render(true));
if (window.ResizeObserver) new ResizeObserver(() => render(true)).observe($("stages"));
populateGroups(); populateActors(); filter(defaultCase);
</script>
</body>
</html>
